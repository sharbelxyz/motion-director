<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1920, height=1080" />
<!-- motion-director theme sample: STUDIO, in the brand of {{NAME}} -->
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<link rel="stylesheet" href="assets/brand.css" />
<link rel="stylesheet" href="assets/md.css" />
<link rel="stylesheet" href="assets/theme.css" />
<style>
  html, body { width: 1920px; height: 1080px; }
  .scene { position: absolute; inset: 0; overflow: hidden; }
  .stage { position: absolute; inset: 0; perspective: 1800px; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="5.4" data-width="1920" data-height="1080" data-fps="30">
  <div class="st-ground"></div>
  <div class="st-burst" id="burst"></div>
  <svg class="st-blob" id="b1" style="left:-300px;top:-340px;width:980px;height:980px"></svg>
  <svg class="st-blob is-light" id="b2" style="left:1440px;top:600px;width:760px;height:760px"></svg>

  <!-- 1. the brand's own line popped in; a designer selects the word that matters -->
  <section id="s1" class="clip scene" data-start="0" data-duration="1.95">
    <svg class="st-swoosh" id="s1-sw" style="left:0;top:0" width="1920" height="1080" viewBox="0 0 1920 1080"><path id="s1-swp" d="M-60 860 C 400 700, 760 980, 1180 780 S 1760 560, 1990 640" /></svg>
    <h1 class="st-title md-line" id="s1-h" style="left:0;right:0;top:360px;text-align:center;font-size:{{HEAD_SIZE}}px" data-in="pop@0.15" data-out="zoom@1.75">{{HEAD_L1}}<br>{{HEAD_L2}} <span class="st-hl" id="s1-last">{{LAST}}</span></h1>
    <div class="st-select" id="s1-sel"><i></i><i></i><i></i><i></i></div>
    <svg class="st-cursor" id="s1-cur" viewBox="0 0 64 64"><path d="M10 6 L10 52 L22 41 L31 60 L39 56 L30 38 L46 38 Z" fill="#fff" stroke="#111" stroke-width="3" stroke-linejoin="round"/></svg>
  </section>

  <!-- 2. the hero object: a glass folder; the brand's real screens rise out of it -->
  <section id="s2" class="clip scene" data-start="1.75" data-duration="2.3">
    <div class="stage">
      <div class="st-folder" id="fold" style="left:560px;top:150px;width:800px;height:640px">
        <div class="st-back"></div>
        <div class="st-card" id="k1"><img src="assets/shots/{{SHOT1}}" alt="" /></div>
        <div class="st-card" id="k2"><img src="assets/shots/{{SHOT2}}" alt="" /></div>
        <div class="st-card" id="k3"><img src="assets/shots/{{SHOT3}}" alt="" /></div>
        <div class="st-front" id="front"><div class="st-label"><img src="assets/{{MARK}}" alt="" /><span>{{NAME}}</span></div></div>
      </div>
    </div>
  </section>

  <!-- 3. the mark inside a glass lens -->
  <section id="s3" class="clip scene" data-start="3.9" data-duration="1.5">
    <div class="st-orb" id="orb" style="left:700px;top:170px;width:520px;height:520px"><div class="st-in"><img src="assets/{{MARK}}" alt="" /></div></div>
    <h2 class="st-title md-line" id="s3-n" style="left:0;right:0;top:760px;text-align:center;font-size:72px" data-in="pop@4.25" data-out="end">{{DOMAIN}}</h2>
  </section>
</div>
<script src="assets/md.js"></script>
<script src="assets/theme.js"></script>
<script>
  const tl = gsap.timeline({ paused: true });
  const S = MD.studio;
  S.blob(document.getElementById("b1"), { petals: 5, seed: 4 });
  S.blob(document.getElementById("b2"), { petals: 6, seed: 9 });
  // place the selection box around the accent word, measured, never guessed
  const lw = document.getElementById("s1-last"), rb = lw.getBoundingClientRect(), pad = 18;
  Object.assign(document.getElementById("s1-sel").style, { left: `${Math.round(rb.left - pad)}px`, top: `${Math.round(rb.top - pad + 8)}px`, width: `${Math.round(rb.width + pad * 2)}px`, height: `${Math.round(rb.height + pad * 2 - 16)}px` });
  MD.lines(tl);

  S.turn(tl, "#burst", 0, 5.4, 10);
  tl.fromTo(["#b1", "#b2"], { scale: 0.3, rotation: -40, opacity: 0 }, { scale: 1, rotation: 0, opacity: 0.9, duration: 1.1, stagger: 0.15, ease: "expo.out" }, 0);
  tl.to("#b1", { rotation: 35, x: 40, duration: 4.3, ease: "none" }, 1.1);
  tl.to("#b2", { rotation: -30, x: -50, duration: 4.15, ease: "none" }, 1.25);

  // 1
  S.swoosh(tl, "#s1-swp", 0.05, 0.7, 1.35);
  S.cursor(tl, "#s1-cur", [{ x: 1500, y: 900, at: 0.6 }, { x: rb.right + 6, y: rb.bottom - 6, at: 0.62, dur: 0.45 }]);
  S.select(tl, "#s1-sel", 1.1);
  tl.fromTo("#s1-last", { color: "#ffffff" }, { color: "var(--st-deep)", duration: 0.01 }, 1.12);
  tl.fromTo("#s1-last", { backgroundColor: "rgba(255,255,255,0)" }, { backgroundColor: "rgba(255,255,255,1)", duration: 0.12 }, 1.12);
  tl.to(["#s1-sel", "#s1-cur"], { opacity: 0, duration: 0.15 }, 1.72);

  // 2: folder pops in, cards rise and fan, the glass front lands, light runs over it
  S.pop(tl, "#fold", 1.8, { from: 0.4, dur: 0.55, y: 120 });
  [["#k1", -16, -160, -9], ["#k2", 0, -220, 0], ["#k3", 16, -160, 9]].forEach(([k, x, y, r], i) =>
    tl.fromTo(k, { yPercent: 0, xPercent: 0, rotation: 0 }, { y, xPercent: x * 2, rotation: r, duration: 0.6, ease: "back.out(1.6)" }, 2.25 + i * 0.09));
  tl.fromTo("#front", { rotationX: -55 }, { rotationX: -8, duration: 0.6, ease: "back.out(1.5)" }, 2.05);
  S.sheen(tl, "#front", 2.8, 0.9);
  tl.fromTo("#fold", { rotationY: -14 }, { rotationY: 10, duration: 2.2, ease: "power1.inOut" }, 1.8);
  S.unpop(tl, "#fold", 3.85, 0.25);

  // 3: the lens rolls in, the name pops under it
  tl.fromTo("#orb", { x: 1100, rotation: 220, scale: 0.6 }, { x: 0, rotation: 0, scale: 1, duration: 0.75, ease: "back.out(1.3)" }, 3.9);
  MD.stamp(tl, "#orb", 4.65, 0.06);

  MD.finish(tl);
  window.__timelines = window.__timelines || {};
  window.__timelines["main"] = tl;
</script>
</body>
</html>
