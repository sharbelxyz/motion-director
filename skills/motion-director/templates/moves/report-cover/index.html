<!doctype html>
<html lang="en" data-composition-variables='[
  {"id":"kicker","type":"string","label":"Small line over the cover title","default":"Annual report"},
  {"id":"title","type":"string","label":"Cover title","default":"What actually worked"},
  {"id":"vol","type":"string","label":"Edition line, top right of the cover","default":"Vol. 01"},
  {"id":"values","type":"string","label":"Cover bar chart values, comma separated (3 to 7)","default":"12,18,26,41,64"},
  {"id":"finding","type":"string","label":"Label on the key page","default":"Key finding"},
  {"id":"value","type":"number","label":"The key number","default":212},
  {"id":"prefix","type":"string","label":"Before the number","default":"+"},
  {"id":"suffix","type":"string","label":"After the number","default":"%"},
  {"id":"line","type":"string","label":"What the number means (one short line)","default":"more reach from one change"},
  {"id":"page","type":"string","label":"Page number on the key page","default":"2"}
]'>
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width={{W}}, height={{H}}" />
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<link rel="stylesheet" href="assets/brand-fonts.css" />
<style>
  @font-face { font-family: "MV Serif"; src: url("assets/fonts/PlayfairDisplay-wght.ttf"); font-weight: 400 900; font-display: block; }
  html, body { margin: 0; width: {{W}}px; height: {{H}}px; overflow: hidden; background: #111; }
  #root { position: relative; width: {{W}}px; height: {{H}}px; overflow: hidden; font-family: var(--font-body); --tx: #1C1B21; --mu: #7d7a84; }
  #ground { position: absolute; inset: -10%; background: #151515 url(assets/leather.jpg) center / calc(var(--u) * 820); }
  #ground::after { content: ""; position: absolute; inset: 0;
    background: radial-gradient(55% 45% at 42% 30%, rgba(255,226,180,.22), transparent 70%), radial-gradient(40% 35% at 85% 90%, color-mix(in srgb, var(--accent) 14%, transparent), transparent 70%),
      radial-gradient(130% 100% at 50% 45%, transparent 40%, rgba(0,0,0,.72)); }
  #stage { position: absolute; inset: 0; perspective: calc(var(--u) * 2600); perspective-origin: 50% 35%; }
  #cam { position: absolute; inset: 0; transform-style: preserve-3d; }
  #rep { position: absolute; transform-style: preserve-3d; }
  #rshd { position: absolute; inset: 0; transform: translateZ(-2px); border-radius: calc(var(--r) * 6);
    box-shadow: 0 calc(var(--r) * 4) calc(var(--r) * 6) rgba(0,0,0,.5), calc(var(--r) * 18) calc(var(--r) * 40) calc(var(--r) * 60) rgba(0,0,0,.55); }
  .sheet { position: absolute; inset: 0; overflow: hidden; border-radius: 0 calc(var(--r) * 5) calc(var(--r) * 5) 0; background: #F7F6F2 url(assets/paper.jpg) center / calc(var(--r) * 700); }
  /* the page block: the inner pages seen at their edges */
  #page { transform: translateZ(0px); box-shadow: 0 calc(var(--r) * 2) 0 #e2ded4, 0 calc(var(--r) * 4) 0 #d5d0c4, 0 calc(var(--r) * 6) 0 #c4bead, 0 calc(var(--r) * 7) 0 #8f8a80; }
  #cover { transform-origin: 0 50%; transform-style: preserve-3d; }
  #cover .side { position: absolute; inset: 0; backface-visibility: hidden; overflow: hidden; border-radius: 0 calc(var(--r) * 5) calc(var(--r) * 5) 0; }
  #front { background: #F7F6F2 url(assets/paper.jpg) center / calc(var(--r) * 700); }
  #back { transform: rotateY(180deg); background: #EFEDE7 url(assets/paper.jpg) center / calc(var(--r) * 640); border-radius: calc(var(--r) * 5) 0 0 calc(var(--r) * 5) !important; }
  #back::after { content: ""; position: absolute; inset: 0; background: linear-gradient(270deg, rgba(0,0,0,.14), transparent 18%); }
  .shade { position: absolute; inset: 0; pointer-events: none; background: #000; opacity: 0; }
  /* the binding strip on the left edge */
  #bind { position: absolute; left: 0; top: 0; bottom: 0; transform: translateZ(3px); border-radius: calc(var(--r) * 3) 0 0 calc(var(--r) * 3);
    background: linear-gradient(90deg, #0d0d10, #2a2a30 45%, #121216); box-shadow: inset 0 0 0 1px rgba(255,255,255,.06); }
  .ab { position: absolute; box-sizing: border-box; white-space: nowrap; line-height: 1; color: var(--tx); }
  .print { mix-blend-mode: multiply; }
  .k { font-weight: 800; font-size: calc(var(--r) * 34); letter-spacing: .2em; text-transform: uppercase; color: var(--accent); }
  .ttl { font-family: "MV Serif", serif; font-weight: 800; color: var(--tx); line-height: 1.02; white-space: normal; letter-spacing: -.01em; }
  .mu { font-weight: 650; font-size: calc(var(--r) * 32); color: var(--mu); }
  .bar { position: absolute; bottom: 0; transform-origin: 50% 100%; background: linear-gradient(180deg, color-mix(in srgb, var(--accent) 80%, #fff), var(--accent)); }
  .bar.dim { background: color-mix(in srgb, var(--tx) 22%, #d8d4cc); }
  #axis { position: absolute; height: calc(var(--r) * 3); background: var(--tx); }
  #mk { border-radius: calc(var(--r) * 10); overflow: hidden; }
  #mk img { width: 100%; height: 100%; object-fit: cover; display: block; }
  #big { font-family: var(--font-display); color: var(--tx); letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
  #big .ac { color: var(--accent); }
  #big .ac:first-child { margin-right: .06em; }
  #big .ac:last-child { margin-left: .04em; }
  #lite { position: absolute; inset: 0; pointer-events: none; transform: translateZ(4px);
    background: radial-gradient(90% 70% at 18% 6%, rgba(255,240,215,.22), transparent 65%), linear-gradient(160deg, transparent 50%, rgba(40,30,20,.12)); }
  #fshadow { position: absolute; inset: 0; pointer-events: none; transform: translateZ(1px); background: linear-gradient(90deg, rgba(0,0,0,.5), rgba(0,0,0,.15) 60%, transparent); opacity: 0; transform-origin: 0 50%; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="{{DUR}}" data-width="{{W}}" data-height="{{H}}" data-fps="30">
  <div id="ground"></div>
  <div id="stage"><div id="cam">
    <div id="rep">
      <div id="rshd"></div>
      <div class="sheet" id="page"><div id="kp"></div></div>
      <div id="fshadow"></div>
      <div id="cover"><div class="side" id="front"><div id="cv"></div><div class="shade" id="fsh"></div></div><div class="side" id="back"><div class="shade" id="bsh"></div></div></div>
      <div id="bind"></div>
      <div id="lite"></div>
    </div>
  </div></div>
</div>
<script src="assets/move.js"></script>
<script>
(async () => {
  const { v, tl, u, W, H, safe } = MV;
  await Promise.all([document.fonts.load('800 80px "MV Serif"')]);
  const root = document.getElementById("root"), D = +root.dataset.duration, $ = (q) => document.querySelector(q);
  const P = MV.portrait;
  // ---- the report, designed at 800 x 1100 (A4)
  const RWd = 800, RHd = 1100;
  const availW = W - safe.left - safe.right, availH = H - safe.top - safe.bottom;
  const RH = P ? Math.min(availH * 0.82, availW * 0.9 / RWd * RHd) : H * 0.8, RW = RH * RWd / RHd, r = RW / RWd;
  root.style.setProperty("--r", r + "px");
  const R = (n) => n * r + "px";
  const rx = W / 2 - RW / 2, ry = H / 2 - RH / 2;
  Object.assign($("#rep").style, { left: rx + "px", top: ry + "px", width: RW + "px", height: RH + "px" });
  for (const id of ["#cover"]) Object.assign($(id).style, { position: "absolute", inset: "0" });
  $("#bind").style.width = R(26);
  const tw = (e) => { const g = document.createRange(); g.selectNodeContents(e); return g.getBoundingClientRect().width; };
  const mk = (par, cls, txt, x, y, fs) => { const d = document.createElement("div"); d.className = "ab " + cls; if (txt != null) d.textContent = txt; Object.assign(d.style, { left: R(x), top: R(y) }); if (fs) d.style.fontSize = R(fs); par.appendChild(d); return d; };
  const L = 76, IW = RWd - L - 60;

  // ---- the cover: kicker, title, a big printed bar chart, the brand at the foot
  const cv = $("#cv"); cv.className = "print"; Object.assign(cv.style, { position: "absolute", inset: 0 });
  const k1 = mk(cv, "k", v.kicker || "", L, 80); MV.fitText(k1, IW * 0.62 * r, 12);
  const vol = mk(cv, "mu", v.vol || "", 0, 80); MV.fitText(vol, IW * 0.3 * r, 12); vol.style.left = (RW - 60 * r - tw(vol)) + "px";
  const ttl = mk(cv, "ttl", v.title || "", L, 162, 92); ttl.style.width = R(IW);
  while (ttl.getBoundingClientRect().height > 92 * r * 2.2 && parseFloat(ttl.style.fontSize) > 40 * r) ttl.style.fontSize = (parseFloat(ttl.style.fontSize) - 4 * r) + "px";
  const ttlB = 162 + ttl.getBoundingClientRect().height / r;
  const vals = String(v.values || "").split(",").map((x) => parseFloat(x)).filter((x) => isFinite(x)).slice(0, 7);
  const vmax = Math.max(...vals, 1), NB = vals.length || 1;
  const chT = Math.max(ttlB + 70, 420), chB = 900, chH = chB - chT, gap = 22, bw = (IW - gap * (NB - 1)) / NB;
  const chart = document.createElement("div"); Object.assign(chart.style, { position: "absolute", left: R(L), top: R(chT), width: R(IW), height: R(chH) }); cv.appendChild(chart);
  const bars = vals.map((x, i) => { const b = document.createElement("div"); b.className = "bar" + (i < NB - 1 ? " dim" : ""); Object.assign(b.style, { left: R(i * (bw + gap)), width: R(bw), height: R(chH * Math.max(0.04, x / vmax)) }); chart.appendChild(b); return b; });
  const ax = document.createElement("div"); ax.id = "axis"; Object.assign(ax.style, { left: R(L - 10), top: R(chB), width: R(IW + 20) }); cv.appendChild(ax);
  const m1 = document.createElement("div"); m1.id = "mk"; m1.className = "ab"; Object.assign(m1.style, { left: R(L), top: R(966), width: R(66), height: R(66) }); cv.appendChild(m1); if (v.mark) m1.appendChild(MV.img(v.mark));
  const bn = mk(cv, "", (v.brandName || "").trim(), L + 86, 982, 38); bn.style.fontFamily = "var(--font-display)"; MV.fitText(bn, 320 * r, 12);
  const dm = mk(cv, "mu", v.domain || "", 0, 986); MV.fitText(dm, 260 * r, 12); dm.style.left = (RW - 60 * r - tw(dm)) + "px";

  // ---- the inside of the cover: a short contents list, printed quietly (the back face is mirrored, so it is laid out from its own left)
  const bk = document.createElement("div"); bk.className = "print"; bk.dataset.bleed = ""; Object.assign(bk.style, { position: "absolute", inset: 0 }); $("#back").insertBefore(bk, $("#bsh"));
  const ck = mk(bk, "k", "Contents", 60, 110); ck.style.color = "var(--mu)";
  ["Summary", v.finding || "", "Method", "Next steps"].filter(Boolean).forEach((t, i) => {
    const y = 200 + i * 90; const n = mk(bk, "mu", String(i + 1).padStart(2, "0"), 60, y, 36); n.style.color = "var(--accent)";
    const tt = mk(bk, "ttl", t, 140, y - 4, 44); tt.style.whiteSpace = "nowrap"; MV.fitText(tt, (RWd - 230) * r, 12);
    const h = document.createElement("div"); Object.assign(h.style, { position: "absolute", left: R(60), top: R(y + 62), width: R(RWd - 150), height: R(2), background: "rgba(28,27,33,.14)" }); bk.appendChild(h);
  });

  // ---- the key page
  const kp = $("#kp"); kp.className = "print"; Object.assign(kp.style, { position: "absolute", inset: 0 });
  const fk = mk(kp, "k", v.finding || "", L, 110); MV.fitText(fk, IW * r, 12);
  const rl = document.createElement("div"); Object.assign(rl.style, { position: "absolute", left: R(L), top: R(170), width: R(90), height: R(8), background: "var(--accent)" }); kp.appendChild(rl);
  const big = mk(kp, "", null, L - 6, 250, 250); big.id = "big";
  const pre = v.prefix || "", suf = v.suffix || "", N = +v.value || 0, dec = String(v.value).includes(".") ? String(v.value).split(".")[1].length : 0;
  const fmtN = (x) => x.toLocaleString("en-US", { minimumFractionDigits: dec, maximumFractionDigits: dec });
  big.innerHTML = `<span class="ac"></span><span class="n"></span><span class="ac"></span>`;
  const [bp, bnum, bs] = big.children; bp.textContent = pre; bs.textContent = suf; bnum.textContent = fmtN(N);
  MV.fitText(big, IW * r, 40);
  const bfs = parseFloat(big.style.fontSize) || 250 * r;
  big.style.width = (tw(big) + 4) + "px";
  const ln = mk(kp, "ttl", v.line || "", L, 250 + bfs / r + 30, 60); ln.style.width = R(IW);
  while (ln.getBoundingClientRect().height > 60 * r * 2.2 && parseFloat(ln.style.fontSize) > 30 * r) ln.style.fontSize = (parseFloat(ln.style.fontSize) - 3 * r) + "px";
  const lnB = 250 + bfs / r + 30 + ln.getBoundingClientRect().height / r;
  // a printed trend line under it, the last point in the accent
  const gT = Math.max(lnB + 70, 700), gB = 960;
  const NS = "http://www.w3.org/2000/svg", svg = document.createElementNS(NS, "svg");
  Object.assign(svg.style, { position: "absolute", left: R(L), top: R(gT), width: R(IW), height: R(gB - gT), overflow: "visible" });
  svg.setAttribute("viewBox", `0 0 ${IW} ${gB - gT}`); kp.appendChild(svg);
  const gh = gB - gT, pts = [0.08, 0.14, 0.12, 0.22, 0.3, 0.45, 0.62, 0.9].map((y, i, a) => [i / (a.length - 1) * (IW - 20) + 10, gh - 10 - y * (gh - 30)]);
  for (let i = 0; i <= 3; i++) { const l = document.createElementNS(NS, "line"); const y = 10 + i * (gh - 20) / 3; Object.assign(l, {}); l.setAttribute("x1", 0); l.setAttribute("x2", IW); l.setAttribute("y1", y); l.setAttribute("y2", y); l.setAttribute("stroke", "rgba(28,27,33,.14)"); l.setAttribute("stroke-width", 2); svg.appendChild(l); }
  const path = document.createElementNS(NS, "path"); path.setAttribute("d", pts.map((p, i) => (i ? "L" : "M") + p[0].toFixed(1) + " " + p[1].toFixed(1)).join(" "));
  path.setAttribute("fill", "none"); path.setAttribute("stroke", "var(--accent)"); path.setAttribute("stroke-width", 7); path.setAttribute("stroke-linejoin", "round"); path.setAttribute("stroke-linecap", "round"); svg.appendChild(path);
  const plen = path.getTotalLength(); path.style.strokeDasharray = plen; path.style.strokeDashoffset = plen;
  const dot = document.createElementNS(NS, "circle"); const lp = pts[pts.length - 1]; dot.setAttribute("cx", lp[0]); dot.setAttribute("cy", lp[1]); dot.setAttribute("r", 14); dot.setAttribute("fill", "var(--accent)"); svg.appendChild(dot);
  const pg = mk(kp, "mu", v.page || "", 0, 1020); pg.style.left = (RW / 2 - tw(pg) / 2) + "px";

  // ---- timeline
  // 0 the report is slid onto the desk; 0.55 the cover chart rises; 1.85 the cover lifts open on its binding and the camera
  // slides to the key page; 2.75 the number counts up and lands (the moment) while the trend line draws
  const TO = 1.85, TN = 2.75;
  const panX = P ? 0 : W > H ? RW * 0.42 : RW * 0.22;
  tl.fromTo("#cam", { rotationX: 22, rotationZ: -4, scale: 0.92, y: 30 * u, x: 0 }, { rotationX: 16, rotationZ: -2, scale: 0.96, y: 10 * u, x: 0, duration: TO, ease: "sine.inOut", transformOrigin: "50% 50%" }, 0);
  tl.to("#cam", { rotationX: 10, rotationZ: 0, scale: P ? 1.0 : W > H ? 1.0 : 0.98, x: panX, y: 0, duration: 1.3, ease: "power3.inOut" }, TO);
  tl.to("#cam", { rotationX: 8, scale: P ? 1.03 : W > H ? 1.03 : 1.0, x: panX * 1.02, duration: D - TO - 1.3, ease: "sine.inOut" }, TO + 1.3);
  tl.fromTo("#ground", { x: 0, y: 0 }, { x: -40 * u, y: -24 * u, duration: D, ease: "sine.inOut" }, 0);
  tl.fromTo("#rep", { x: 300 * u, y: 600 * u, rotation: 12 }, { x: 0, y: 0, rotation: -2, duration: 1.0, ease: "expo.out" }, 0);
  tl.to("#rep", { rotation: 0, duration: 1.2, ease: "sine.inOut" }, 1.0);
  tl.fromTo([k1, vol, ttl], { opacity: 0, y: 12 * r }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out", stagger: 0.07 }, 0.35);
  tl.fromTo(bars, { scaleY: 0 }, { scaleY: 1, duration: 0.8, ease: "expo.out", stagger: 0.08, transformOrigin: "50% 100%" }, 0.55);
  tl.fromTo([m1, bn, dm], { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power2.out" }, 0.9);
  // the cover opens: it peels up, swings over the binding and lies open to the left
  gsap.set("#cover", { z: 3 });
  tl.fromTo("#cover", { rotationY: 0 }, { rotationY: -172, duration: 1.05, ease: "power2.inOut" }, TO);
  tl.to("#cover", { rotationY: -176, duration: D - TO - 1.05, ease: "sine.out" }, TO + 1.05);
  tl.to(cv, { opacity: 0, duration: 0.14, ease: "power2.in" }, TO + 0.3); tl.set(cv, { visibility: "hidden" }, TO + 0.5); gsap.set(bk, { visibility: "hidden", opacity: 0 }); tl.set(bk, { visibility: "visible" }, TO + 0.5); tl.to(bk, { opacity: 1, duration: 0.2, ease: "power2.out" }, TO + 0.62);
  tl.fromTo("#fsh", { opacity: 0 }, { opacity: 0.45, duration: 0.55, ease: "power2.in" }, TO);
  tl.fromTo("#bsh", { opacity: 0.5 }, { opacity: 0, duration: 0.5, ease: "power2.out" }, TO + 0.55);
  tl.fromTo("#fshadow", { opacity: 0, scaleX: 1 }, { opacity: 0.9, scaleX: 0.5, duration: 0.5, ease: "power2.in" }, TO);
  tl.to("#fshadow", { opacity: 0, scaleX: 0, duration: 0.4, ease: "power2.out" }, TO + 0.5);
  // the key number counts with the playhead, then presses in
  const o = { n: 0 }; bnum.textContent = fmtN(0);
  tl.fromTo([fk, rl], { opacity: 0 }, { opacity: 1, duration: 0.3 }, TO + 0.6);
  tl.to(o, { n: N, duration: 0.85, ease: "power3.out", onUpdate: () => { bnum.textContent = fmtN(o.n); } }, TN - 0.1);
  tl.fromTo(big, { scale: 1.06, opacity: 0.0 }, { scale: 1, opacity: 1, duration: 0.25, ease: "power2.out", transformOrigin: "0% 100%" }, TN - 0.1);
  tl.to(big, { scale: 0.97, duration: 0.06, ease: "power2.out" }, TN + 0.75); tl.to(big, { scale: 1, duration: 0.5, ease: "expo.out" }, TN + 0.81);
  tl.to("#rep", { z: -6, duration: 0.06, ease: "power2.out" }, TN + 0.75); tl.to("#rep", { z: 0, duration: 0.5, ease: "expo.out" }, TN + 0.81);
  tl.fromTo(ln, { opacity: 0, y: 12 * r }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, TN + 0.35);
  tl.to(path, { strokeDashoffset: 0, duration: 1.0, ease: "power2.inOut" }, TN + 0.2);
  tl.fromTo(dot, { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.4, ease: "back.out(2.4)", svgOrigin: `${lp[0]} ${lp[1]}` }, TN + 1.15);
  tl.fromTo(pg, { opacity: 0 }, { opacity: 1, duration: 0.3 }, TO + 0.7);
  MV.done();
})();
</script>
</body>
</html>
