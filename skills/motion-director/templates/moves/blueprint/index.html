<!doctype html>
<html lang="en" data-composition-variables='[
  {"id":"project","type":"string","label":"Project name, written last in the title block","default":"The system"},
  {"id":"title","type":"string","label":"Drawing title under the elevation","default":"Front elevation"},
  {"id":"drawn","type":"string","label":"Drawn by (empty uses the brand name)","default":""},
  {"id":"sheetNo","type":"string","label":"Sheet number","default":"A-101"},
  {"id":"scale","type":"string","label":"Scale","default":"1:50"},
  {"id":"centre","type":"string","label":"Keep the authored framing on 9:16 (off)","default":"off"}
]'>
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width={{W}}, height={{H}}" />
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<link rel="stylesheet" href="assets/brand-fonts.css" />
<style>
  @font-face { font-family: "MV Draft"; src: url("assets/fonts/ShareTechMono-Regular.ttf"); font-display: block; }
  html, body { margin: 0; width: {{W}}px; height: {{H}}px; overflow: hidden; background: #1b120c; }
  #root { position: relative; width: {{W}}px; height: {{H}}px; overflow: hidden; font-family: var(--font-body); }
  /* ground: a walnut drafting table under one warm lamp */
  #ground { position: absolute; inset: -10%; background: #2a1c12 url(assets/wood.jpg) center / calc(var(--u) * 1100); }
  #ground::after { content: ""; position: absolute; inset: 0; background: radial-gradient(55% 45% at 40% 30%, rgba(255,214,160,.16), transparent 72%), radial-gradient(130% 100% at 50% 45%, transparent 38%, rgba(0,0,0,.7)); }
  #stage { position: absolute; inset: 0; perspective: calc(var(--u) * 2600); perspective-origin: 50% 45%; }
  #cam { position: absolute; inset: 0; transform-style: preserve-3d; }
  #shadow { position: absolute; background: rgba(0,0,0,.6); filter: blur(calc(var(--s) * 22)); }
  #sheet { position: absolute; overflow: hidden; border-radius: calc(var(--s) * 3); }
  /* cyanotype: a real paper scan multiplied into Prussian blue, with the uneven coating of a real print */
  #blue { position: absolute; inset: 0; background: #1F4F8F url(assets/paper-white.jpg) center / calc(var(--s) * 520); background-blend-mode: multiply; }
  #coat { position: absolute; inset: 0; background: url(assets/inkmask.png) 0 0 / calc(var(--s) * 380); mix-blend-mode: soft-light; opacity: .55; }
  #grid { position: absolute; inset: 0; opacity: .1;
    background: linear-gradient(90deg, rgba(235,243,255,.9) 0 1px, transparent 1px) 0 0 / calc(var(--s) * 25) calc(var(--s) * 25), linear-gradient(rgba(235,243,255,.9) 0 1px, transparent 1px) 0 0 / calc(var(--s) * 25) calc(var(--s) * 25); }
  #edge { position: absolute; inset: 0; box-shadow: inset 0 0 calc(var(--s) * 40) rgba(5,20,50,.55); }
  #light { position: absolute; inset: 0; pointer-events: none; background: radial-gradient(90% 70% at 25% 12%, rgba(255,240,215,.2), transparent 65%), linear-gradient(160deg, transparent 50%, rgba(0,10,30,.25)); }
  #draw { position: absolute; left: 0; top: 0; overflow: visible; filter: drop-shadow(0 0 calc(var(--s) * 1.6) rgba(225,238,255,.55)); }
  #draw .ln { fill: none; stroke: #EEF4FF; stroke-linecap: round; stroke-linejoin: round; }
  #draw text { fill: #EEF4FF; font-family: "MV Draft", monospace; }
  /* the title block: white rules, small labels, values lettered in */
  .tb { position: absolute; font-family: "MV Draft", monospace; color: #EEF4FF; white-space: nowrap; line-height: 1; text-shadow: 0 0 calc(var(--s) * 1.6) rgba(225,238,255,.5); }
  .lab { opacity: .72; letter-spacing: .14em; text-transform: uppercase; }
  .rl { position: absolute; background: #EEF4FF; box-shadow: 0 0 calc(var(--s) * 1.6) rgba(225,238,255,.5); }
  #pencil { position: absolute; transform-origin: 50% 50%; filter: drop-shadow(calc(var(--u) * 10) calc(var(--u) * 16) calc(var(--u) * 10) rgba(0,0,0,.55)); }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="{{DUR}}" data-width="{{W}}" data-height="{{H}}" data-fps="30">
  <div id="ground"></div>
  <div id="stage"><div id="cam">
    <div id="shadow"></div>
    <div id="sheet"><div id="blue"></div><div id="coat"></div><div id="grid"></div><div id="edge"></div>
      <svg id="draw" xmlns="http://www.w3.org/2000/svg"></svg><div id="tblock"></div><div id="light"></div></div>
    <img id="pencil" src="assets/pencil.png" alt="" />
  </div></div>
</div>
<script src="assets/move.js"></script>
<script>
(async () => {
  const { v, tl, u, W, H } = MV;
  await document.fonts.load('40px "MV Draft"');
  const root = document.getElementById("root"), D = +root.dataset.duration, $ = (q) => document.querySelector(q);
  const P = MV.portrait;

  // ---- the sheet: an A-series ratio, landscape on wide frames, portrait on 9:16
  const SW = P ? 707 : 1000, SH = P ? 1000 : 707;
  const s = P ? Math.min((W * 0.9) / SW, (H * 0.78) / SH) : Math.min((W * 0.8) / SW, (H * 0.84) / SH);
  root.style.setProperty("--s", s + "px");
  const sw = SW * s, sh = SH * s, sx = (W - sw) / 2, sy = (H - sh) / 2;
  for (const id of ["#sheet", "#shadow"]) Object.assign($(id).style, { left: sx + "px", top: sy + "px", width: sw + "px", height: sh + "px" });
  const svg = $("#draw"); svg.setAttribute("width", sw); svg.setAttribute("height", sh); svg.setAttribute("viewBox", `0 0 ${SW} ${SH}`);
  const NS = "http://www.w3.org/2000/svg";
  const mk = (par, tag, at) => { const e = document.createElementNS(NS, tag); for (const k in at) e.setAttribute(k, at[k]); par.appendChild(e); return e; };

  // ---- the drawing (a 700 x 620 box): a gabled studio in front elevation, grid lines, dimensions, the title under it
  // the sheet border, and where the drawing and title block sit
  mk(svg, "rect", { class: "ln", x: 18, y: 18, width: SW - 36, height: SH - 36, "stroke-width": 2.4 });
  const box = P ? { x: 20, y: 34, k: 0.95 } : { x: 34, y: 40, k: 0.99 };
  const g = mk(svg, "g", { transform: `translate(${box.x} ${box.y}) scale(${box.k})` });
  const paths = [];   // [element, start, duration]
  const L = (d, w, t0, dur) => { const e = mk(g, "path", { class: "ln", d, "stroke-width": w, pathLength: 1, "stroke-dasharray": "1 1", "stroke-dashoffset": 1 }); paths.push([e, t0, dur]); return e; };
  const rect = (x, y, w, h) => `M${x} ${y} H${x + w} V${y + h} H${x} Z`;
  // ground and its hatch
  L("M40 470 H660", 3.4, 0.3, 0.5);
  let hatch = ""; for (let x = 52; x < 660; x += 16) hatch += `M${x} 474 l-12 14 `;
  L(hatch, 1.3, 0.55, 0.5);
  // walls, eaves and the gable
  L("M120 470 V250 M580 470 V250", 3.2, 0.7, 0.45);
  L("M96 262 L350 128 L604 262", 3.4, 0.95, 0.55);
  L("M120 250 H580", 2.2, 1.25, 0.35);
  L("M120 340 H580", 1.4, 1.4, 0.35);
  // the round window in the gable
  L("M350 171 a24 24 0 1 0 0.01 0", 2, 1.55, 0.35);
  L("M326 195 H374 M350 171 V219", 1.2, 1.75, 0.25);
  // ground floor: a glazed wall, the door, a side window
  L(rect(150, 362, 170, 108), 2.4, 1.6, 0.4);
  L("M192 362 V470 M235 362 V470 M278 362 V470 M150 396 H320", 1.2, 1.85, 0.35);
  L(rect(395, 372, 74, 98), 2.4, 1.75, 0.35);
  L("M455 418 V430", 2.4, 2.0, 0.1);
  L(rect(500, 362, 58, 70), 2.2, 1.9, 0.3);
  // upper floor windows
  [[158, 0], [305, 0.08], [452, 0.16]].forEach(([x, d]) => { L(rect(x, 272, 90, 52), 2.2, 2.0 + d, 0.3); L(`M${x + 45} 272 V324`, 1.1, 2.18 + d, 0.18); });
  // grid lines (dashed, drawn top down) and their bubbles
  const grid = [[120, "A"], [350, "B"], [580, "C"]];
  const gl = grid.map(([x], i) => { const e = mk(g, "path", { class: "ln", d: `M${x} 92 V500`, "stroke-width": 1, "stroke-dasharray": "14 6 3 6", opacity: 0.75 }); return e; });
  const bubbles = grid.map(([x, ch]) => { const b = mk(g, "g", {}); mk(b, "circle", { class: "ln", cx: x, cy: 66, r: 25, "stroke-width": 2 }); const t = mk(b, "text", { x, y: 77, "font-size": 30, "text-anchor": "middle" }); t.textContent = ch; return b; });
  // dimensions: the width below, the two heights at the right, with ticks and extension lines
  L("M120 482 V556 M580 482 V556", 1.1, 2.55, 0.2);
  L("M110 540 H590", 1.4, 2.65, 0.3);
  L("M112 548 l16 -16 M572 548 l16 -16", 2, 2.9, 0.12);
  L("M606 470 H652 M606 250 H652 M362 128 H652", 1.1, 2.7, 0.25);
  L("M636 480 V118", 1.4, 2.8, 0.3);
  L("M628 478 l16 -16 M628 258 l16 -16 M628 136 l16 -16", 2, 3.0, 0.12);
  const dimT = (x, y, txt, rot) => { const t = mk(g, "text", { x, y, "font-size": 30, "text-anchor": "middle", transform: rot ? `rotate(-90 ${x} ${y})` : "" }); t.textContent = txt; return t; };
  const dims = [dimT(350, 528, "12 000"), dimT(622, 360, "4 200", true), dimT(622, 189, "2 600", true)];
  // the drawing title, underlined
  const tt = mk(g, "text", { x: 40, y: 612, "font-size": 34, "letter-spacing": 2 }); tt.textContent = (v.title || "").toUpperCase();
  const ttw = Math.min(560, tt.getComputedTextLength()), ttScale = tt.getComputedTextLength() > 560 ? 560 / tt.getComputedTextLength() : 1;
  if (ttScale < 1) tt.setAttribute("textLength", 560), tt.setAttribute("lengthAdjust", "spacingAndGlyphs");
  const ttu = L(`M40 624 H${40 + ttw}`, 2, 3.25, 0.3);
  const ttu2 = L(`M40 630 H${40 + ttw}`, 1, 3.32, 0.3);
  const scl = mk(g, "text", { x: 40 + ttw + 16, y: 612, "font-size": 26, opacity: 0.8 }); scl.textContent = v.scale ? "SCALE " + v.scale : "";
  if (40 + ttw + 16 + scl.getComputedTextLength() > 690) scl.textContent = "";

  // ---- the title block: a strip at the right (landscape) or along the foot (portrait)
  const tb = $("#tblock");
  const TB = P ? { x: 36, y: 690, w: SW - 72, h: SH - 690 - 36 } : { x: 760, y: 36, w: SW - 760 - 36, h: SH - 72 };
  const rl = (x, y, w, h) => { const e = document.createElement("div"); e.className = "rl"; Object.assign(e.style, { left: x * s + "px", top: y * s + "px", width: Math.max(1.5, w * s) + "px", height: Math.max(1.5, h * s) + "px" }); tb.appendChild(e); return e; };
  const txt = (cls, t, x, y, size, maxW) => { const e = document.createElement("div"); e.className = "tb " + cls; e.textContent = t; Object.assign(e.style, { left: x * s + "px", top: y * s + "px", fontSize: size * s + "px" }); tb.appendChild(e); if (maxW) MV.fitText(e, maxW * s, 10); return e; };
  const brand = (v.brandName || "").trim();
  const fields = [["Drawn by", (v.drawn || brand).trim()], ["Scale", v.scale || ""], ["Sheet", v.sheetNo || ""]];
  const rules = [], labs = [], vals = [];
  rules.push(rl(TB.x, TB.y, TB.w, 2.4), rl(TB.x, TB.y + TB.h, TB.w, 2.4), rl(TB.x, TB.y, 2.4, TB.h), rl(TB.x + TB.w, TB.y, 2.4, TB.h + 2.4));
  let projV;
  if (!P) {
    // a vertical strip: the project large at the top, then the fields
    const pH = 250; rules.push(rl(TB.x, TB.y + pH, TB.w, 1.6));
    labs.push(txt("lab", "Project", TB.x + 18, TB.y + 22, 22));
    projV = txt("", (v.project || "").trim(), TB.x + 18, TB.y + 70, 54);
    projV.style.whiteSpace = "normal"; projV.style.width = (TB.w - 36) * s + "px"; projV.style.lineHeight = "1.08"; projV.style.overflowWrap = "anywhere";
    while (projV.getBoundingClientRect().height > (pH - 90) * s && parseFloat(projV.style.fontSize) > 24 * s) projV.style.fontSize = (parseFloat(projV.style.fontSize) - 2) + "px";
    const rowH = (TB.h - pH) / fields.length;
    fields.forEach(([k, val], i) => { const y = TB.y + pH + i * rowH; if (i) rules.push(rl(TB.x, y, TB.w, 1.6));
      labs.push(txt("lab", k, TB.x + 18, y + 22, 22)); vals.push(txt("", val, TB.x + 18, y + 58, 40, TB.w - 36)); });
  } else {
    // a strip along the foot: project across the top row, the fields in three cells under it
    const pH = 160; rules.push(rl(TB.x, TB.y + pH, TB.w, 1.6));
    labs.push(txt("lab", "Project", TB.x + 18, TB.y + 18, 24));
    projV = txt("", (v.project || "").trim(), TB.x + 18, TB.y + 60, 74, TB.w - 36);
    const cw = TB.w / 3;
    fields.forEach(([k, val], i) => { const x = TB.x + i * cw; if (i) rules.push(rl(x, TB.y + pH, 1.6, TB.h - pH));
      labs.push(txt("lab", k, x + 16, TB.y + pH + 16, 24)); vals.push(txt("", val, x + 16, TB.y + pH + 52, 40, cw - 32)); });
  }

  // the pencil, lying on the table by the sheet (B-roll only)
  const pen = $("#pencil"), pw = (P ? 0.78 : 0.42) * (P ? W : W);
  pen.style.width = pw + "px";
  Object.assign(pen.style, { left: (P ? sx + sw - pw * 0.75 : sx + sw - pw * 0.6) + "px", top: (P ? sy + sh + 50 * u : sy + sh - 20 * u) + "px" });
  gsap.set(pen, { rotation: P ? -8 : -24 });

  // ---- timeline
  // 0.0 the sheet on the table, the camera drifting; 0.3 the plotter draws the elevation line by line, then the grid and
  // its bubbles, then the dimensions; 2.6 the title block rules in and its fields are lettered, the project name last
  paths.forEach(([e, t0, d]) => tl.fromTo(e, { attr: { "stroke-dashoffset": 1 } }, { attr: { "stroke-dashoffset": 0 }, duration: d, ease: "power1.inOut", immediateRender: true }, t0));
  gl.forEach((e, i) => tl.fromTo(e, { scaleY: 0 }, { scaleY: 1, duration: 0.5, ease: "power2.out", transformOrigin: "50% 0%", immediateRender: true }, 2.15 + i * 0.1));
  bubbles.forEach((b, i) => tl.fromTo(b, { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.4, ease: "back.out(2)", transformOrigin: "50% 50%", immediateRender: true }, 2.1 + i * 0.1));
  dims.forEach((e, i) => tl.fromTo(e, { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power2.out", immediateRender: true }, 2.95 + i * 0.08));
  tl.fromTo([tt, scl], { opacity: 0 }, { opacity: 1, duration: 0.35, ease: "power2.out", immediateRender: true }, 3.1);
  // title block: rules first, then labels, then the values lettered left to right; the project name lands last
  rules.forEach((e, i) => tl.fromTo(e, { scaleX: 0, scaleY: 0 }, { scaleX: 1, scaleY: 1, duration: 0.35, ease: "power2.out", transformOrigin: "0% 0%", immediateRender: true }, 2.5 + i * 0.04));
  tl.fromTo(labs, { opacity: 0 }, { opacity: 0.72, duration: 0.3, stagger: 0.05, ease: "power2.out", immediateRender: true }, 2.8);
  vals.forEach((e, i) => tl.fromTo(e, { clipPath: "inset(-20% 100% -20% 0%)" }, { clipPath: "inset(-20% 0% -20% 0%)", duration: 0.35, ease: "steps(10)", immediateRender: true }, 3.05 + i * 0.22));
  const TP = 3.7;
  tl.fromTo(projV, { clipPath: "inset(-20% 100% -20% 0%)" }, { clipPath: "inset(-20% 0% -20% 0%)", duration: 0.5, ease: "steps(14)", immediateRender: true }, TP);
  tl.fromTo(projV, { textShadow: "0 0 0px rgba(225,238,255,0)" }, { textShadow: `0 0 ${10 * s}px rgba(225,238,255,.8)`, duration: 0.18, ease: "power2.out", immediateRender: true }, TP + 0.5);
  tl.to(projV, { textShadow: `0 0 ${1.6 * s}px rgba(225,238,255,.5)`, duration: 0.6, ease: "power2.out" }, TP + 0.68);
  // the camera: a slow 3D drift over the sheet, easing in toward the title block
  tl.fromTo("#cam", { rotationX: 22, rotationZ: -4, scale: 0.98, y: 20 * u }, { rotationX: 11, rotationZ: -1.2, scale: 1.05, y: 0, duration: D, ease: "sine.inOut", transformOrigin: "50% 50%", immediateRender: true }, 0);
  tl.fromTo("#ground", { x: 0, y: 0 }, { x: -30 * u, y: -40 * u, duration: D, ease: "sine.inOut" }, 0);
  tl.set("#shadow", { x: 14 * s, y: 26 * s }, 0);
  tl.fromTo("#light", { backgroundPosition: "0px 0px" }, { backgroundPosition: `${40 * u}px ${20 * u}px`, duration: D, ease: "sine.inOut", immediateRender: true }, 0);
  MV.done();
})();
</script>
</body>
</html>
