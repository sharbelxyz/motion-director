<!doctype html>
<html lang="en" data-composition-variables='[
  {"id":"lines","type":"string","label":"Lines written on the page, separated by ; (up to 4 short lines)","default":"Plan for the week; 1. Write the hook; 2. Film it once; 3. Post it every day"},
  {"id":"circle","type":"string","label":"The word that gets circled (empty: the last word)","default":"once"}
]'>
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width={{W}}, height={{H}}" />
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<link rel="stylesheet" href="assets/brand-fonts.css" />
<style>
  @font-face { font-family: "MV Script"; src: url("assets/fonts/CoveredByYourGrace.ttf"); font-display: block; }
  html, body { margin: 0; width: {{W}}px; height: {{H}}px; overflow: hidden; background: #0d0c0c; }
  #root { position: relative; width: {{W}}px; height: {{H}}px; overflow: hidden; font-family: var(--font-body); }
  /* ground: a real black leather desk blotter under a warm lamp */
  #ground { position: absolute; inset: -6%; background: #161414 url(assets/leather.jpg) center / calc(var(--u) * 900); }
  #ground::after { content: ""; position: absolute; inset: 0; background: radial-gradient(60% 50% at 45% 35%, rgba(255,220,170,.16), transparent 65%), radial-gradient(130% 100% at 50% 45%, transparent 40%, rgba(0,0,0,.6)); }
  #cam { position: absolute; inset: 0; transform-origin: 50% 40%; }
  .boil { translate: var(--bx, 0px) var(--by, 0px); rotate: var(--br, 0deg); }
  #pad { position: absolute; transform-origin: 30% 20%; }
  #pad-b { position: absolute; inset: 0; }
  /* the pad: a real yellow legal sheet (Poly Haven office_notepads) on two more sheets of the same stock */
  .sheet { position: absolute; inset: 0; background: #e4d68c url(assets/legal.jpg) 0 0 / 100% 100%; }
  .under { filter: brightness(.8); box-shadow: 0 calc(var(--u) * 3) calc(var(--u) * 6) rgba(0,0,0,.4); }
  #top { box-shadow: 0 calc(var(--u) * 2) calc(var(--u) * 3) rgba(0,0,0,.35), calc(var(--u) * 10) calc(var(--u) * 24) calc(var(--u) * 40) rgba(0,0,0,.55); }
  /* lamp light falls across the page, brighter at the top left */
  #top::after { content: ""; position: absolute; inset: 0; background: radial-gradient(70% 45% at 30% 18%, rgba(255,250,225,.22), transparent 70%), linear-gradient(rgba(0,0,0,0) 55%, rgba(0,0,0,.14)); pointer-events: none; }
  .ln { position: absolute; left: 0; white-space: nowrap; font-family: "MV Script", cursive; color: #1d2650; filter: url(#bleed); }
  #ring { position: absolute; left: 0; top: 0; overflow: visible; filter: url(#bleed); }
  #ring path { fill: none; stroke: var(--accent); stroke-linecap: round; stroke-linejoin: round; }
  /* the pen: a real ballpoint (Poly Haven stationery_supplies), tip at its left end */
  #pen { position: absolute; left: 0; top: 0; transform-origin: 0 50%; }
  #pen img { display: block; width: 100%; filter: drop-shadow(calc(var(--u) * var(--sx, 10)) calc(var(--u) * var(--sy, 18)) calc(var(--u) * 9) rgba(20,14,0,.45)); }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute">
  <filter id="bleed" x="-5%" y="-10%" width="110%" height="120%">
    <feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="2" seed="2"/>
    <feDisplacementMap in="SourceGraphic" scale="2.4"/>
  </filter>
</svg>
<div id="root" data-composition-id="main" data-start="0" data-duration="{{DUR}}" data-width="{{W}}" data-height="{{H}}" data-fps="30">
  <div id="cam">
    <div id="ground"></div>
    <div id="pad"><div class="boil" id="pad-b">
      <div class="sheet under" id="u2"></div><div class="sheet under" id="u1"></div>
      <div class="sheet" id="top"><div id="txt"></div><svg id="ring" style="visibility:hidden"><path id="ringp"/></svg></div>
      <div id="pen"><img src="assets/pen.png" alt="" /></div>
    </div></div>
  </div>
</div>
<script src="assets/move.js"></script>
<script>
(async () => {
  const { v, tl, u, W, H, safe } = MV;
  await document.fonts.load('80px "MV Script"');
  const D = +document.getElementById("root").dataset.duration, STEP = 1 / 12;
  const twos = (name, d) => { const e = gsap.parseEase(name), n = Math.max(1, Math.round(d * 12)); return (p) => e(Math.min(1, Math.ceil(p * n - 1e-6) / n)); };

  // ---- the page: the camera is close on a legal pad, its top edge and red margin in frame, the rest running off the right and bottom
  const PW = MV.portrait ? W * 1.32 : W > H ? W * 0.82 : W * 1.2, PH = PW * 1714 / 1244;
  const margin = PW * 0.0884, first = PW * 1.3778 * 0.1444, pitch = PW * 0.03445;
  const textL = margin + pitch * 0.8;
  // page origin: the margin line just inside the safe left edge, the top edge just above the safe top
  const PX = Math.min(safe.left + 30 * u - textL, W * 0.08);
  const nRows = Math.max(1, Math.min(4, (v.lines || "").split(";").filter((s) => s.trim()).length)), gap = 3;
  // the written block sits in the middle of the safe zone (its baselines on rules), so the pad's top edge shows above it
  const zMid = (safe.top + (H - (MV.portrait ? 520 * (W / 1080) : safe.bottom))) / 2;
  const PY = zMid - (first + pitch * gap * (nRows + 0.6) / 2);
  const pad = document.getElementById("pad");
  Object.assign(pad.style, { left: PX + "px", top: PY + "px", width: PW + "px", height: PH + "px" });
  gsap.set("#u1", { x: -5 * u, y: 7 * u, rotation: -0.6 }); gsap.set("#u2", { x: 4 * u, y: 14 * u, rotation: 0.7 });

  // ---- the lines of writing, each spanning two rule gaps, their baselines on the rules
  const txt = document.getElementById("txt");
  const rows = (v.lines || "").split(";").map((s) => s.trim()).filter(Boolean).slice(0, 4);
  const maxW = (W - safe.right - 20 * u) - (PX + textL);
  let fs = pitch * 2.5;
  const els = rows.map((r) => { const d = document.createElement("div"); d.className = "ln"; d.textContent = r; txt.appendChild(d); return d; });
  const setFs = () => els.forEach((e) => { e.style.fontSize = fs + "px"; e.style.lineHeight = "1"; });
  setFs();
  const rng = document.createRange(), tw = (e) => { rng.selectNodeContents(e); return rng.getBoundingClientRect().width; };
  while (els.some((e) => tw(e) > maxW) && fs > 16 * u) { fs -= 2; setFs(); }
  // baseline of a line box with line-height 1: measured with a zero-height probe
  const probe = document.createElement("span"); probe.style.cssText = "display:inline-block;width:0;height:0;vertical-align:baseline"; els[0].prepend(probe);
  const base0 = probe.getBoundingClientRect().top - els[0].getBoundingClientRect().top; probe.remove();
  els.forEach((e, i) => { e.style.left = textL + "px"; e.style.top = (first + pitch * (gap * (i + 1)) - base0 - pitch * 0.08) + "px"; });
  const words = els.map((e) => MV.words(e));
  words.flat().forEach((w) => { w.style.clipPath = "inset(-40% 108% -40% -8%)"; });

  // ---- the circled word: the chosen one, else the last word written
  const norm = (s) => s.toLowerCase().replace(/[^\p{L}\p{N}]/gu, "");
  const all = words.flat();
  const target = all.find((w) => v.circle && norm(w.textContent) === norm(v.circle)) || all[all.length - 1];
  const pr = document.getElementById("top").getBoundingClientRect();
  const loc = (b) => ({ l: b.left - pr.left, r: b.right - pr.left, t: b.top - pr.top, b: b.bottom - pr.top });
  const tb = loc(target.getBoundingClientRect());
  const ecx = (tb.l + tb.r) / 2, ecy = (tb.t + tb.b) / 2 + fs * 0.05, rx = (tb.r - tb.l) / 2 + fs * 0.32, ry = fs * 0.62;
  const ring = document.getElementById("ring"), ringp = document.getElementById("ringp");
  ring.setAttribute("width", PW); ring.setAttribute("height", PH);
  // one loop drawn the way a hand does it: starts upper right, goes round anticlockwise, overshoots past the start
  const ringPts = []; const rj = MV.rand(31);
  for (let k = 0; k <= 26; k++) { const a = -0.5 - (k / 24) * Math.PI * 2.12, wob = 1 + (rj() - 0.5) * 0.05 + k * 0.004;
    ringPts.push([ecx + Math.cos(a) * rx * wob, ecy - Math.sin(a) * ry * wob - (k / 26) * fs * 0.12]); }
  ringp.setAttribute("d", "M " + ringPts.map((p) => p.map((n) => n.toFixed(1)).join(" ")).join(" L "));
  ringp.setAttribute("stroke-width", Math.max(4, fs * 0.075));

  // ---- the pen: its tip follows the writing (tip at the image's left end, held at ~38 degrees)
  const pen = document.getElementById("pen"), PL = (MV.portrait ? 0.56 : W > H ? 0.34 : 0.5) * W, ANG = -58;
  pen.style.width = PL + "px";
  const ph = PL * 116 / 1214;
  const penAt = (x, y, lift = 0) => ({ x: x, y: y - ph / 2 - lift * 26 * u, scale: 1 + lift * 0.04, "--sx": 6 + lift * 14, "--sy": 10 + lift * 22 });
  gsap.set(pen, { rotation: ANG, ...penAt(PW * 0.95, PH * 0.6, 1) });

  // ---- timeline
  // 0.2 the pen comes in; 0.45 the lines write on, the tip moving with the ink on twos; then the pen loops the word in brand colour; the pen lifts away
  let t = 0.45;
  const firstW = all[0].getBoundingClientRect(), f0 = loc(firstW);
  tl.fromTo(pen, { rotation: ANG, ...penAt(PW * 0.9, PH * 0.55, 1) }, { ...penAt(f0.l, f0.b - fs * 0.25, 0.3), duration: 0.25, ease: twos("power3.out", 0.25), immediateRender: true }, 0.2);
  const chars = all.reduce((s, w) => s + [...w.textContent].length, 0);
  const budget = 2.25;  // seconds of writing
  const per = Math.min(1, budget / Math.max(0.1, (Math.ceil(chars / 2) + all.length) * STEP));
  const rp = MV.rand(5);
  words.forEach((ws, li) => ws.forEach((w, wi) => {
    const b = loc(w.getBoundingClientRect()), L = [...w.textContent].length, n = Math.max(1, Math.round(Math.ceil(L / 2) * per));
    const d = n * STEP;
    tl.fromTo(w, { clipPath: "inset(-40% 108% -40% -8%)" }, { clipPath: "inset(-40% -8% -40% -8%)", duration: d, ease: `steps(${n})`, immediateRender: true }, t);
    for (let k = 1; k <= n; k++) tl.set(pen, penAt(b.l + (b.r - b.l) * (k / n), b.b - fs * (0.18 + rp() * 0.3)), t + (k - 1) * STEP + 0.001);
    t += d;
    // between words: the pen lifts and hops to the next one (a new line: a bigger hop)
    const nxt = ws[wi + 1] || (words[li + 1] || [])[0];
    if (nxt) { const nb = loc(nxt.getBoundingClientRect()); if (per >= 0.75 || !ws[wi + 1]) { tl.set(pen, penAt(nb.l, nb.b - fs * 0.25, ws[wi + 1] ? 0.25 : 0.5), t + 0.001); t += STEP; } }
  }));
  // the loop round the word, in the brand colour, the tip on the line as it draws
  const TR = t + 0.2, RD = 0.5, RN = Math.round(RD * 12);
  tl.set(pen, penAt(ringPts[0][0], ringPts[0][1], 0.35), t + 0.05);
  tl.set(ring, { visibility: "visible" }, TR);
  const RL = ringp.getTotalLength();
  tl.fromTo(ringp, { strokeDasharray: `${RL} ${RL * 2}`, strokeDashoffset: RL * 1.02 }, { strokeDashoffset: 0, duration: RD, ease: `steps(${RN})`, immediateRender: true }, TR);
  for (let k = 1; k <= RN; k++) { const p = ringp.getPointAtLength(RL * k / RN); tl.set(pen, penAt(p.x, p.y), TR + (k - 1) * STEP + 0.001); }
  // the pen lifts and rests to the side
  const lastB = loc(all[all.length - 1].getBoundingClientRect()).b;
  const textR = Math.max(...all.map((w) => loc(w.getBoundingClientRect()).r));
  tl.to(pen, { ...penAt(textR + fs * 0.5, lastB + fs * 0.9, 1), duration: 0.33, ease: twos("power2.out", 0.33) }, TR + RD + 0.05);
  // boil: the paper breathes, the ink crawls (on twos)
  const rb = MV.rand(9); for (let tt = 0; tt < D; tt += STEP * 2) tl.set("#pad-b", { "--bx": `${((rb() - .5) * 2 * u).toFixed(2)}px`, "--by": `${((rb() - .5) * 2 * u).toFixed(2)}px`, "--br": `${((rb() - .5) * 0.25).toFixed(2)}deg` }, tt);
  const bt = document.querySelector("#bleed feTurbulence"); for (let k = 0, tt = 0; tt < D; tt += STEP * 2, k++) tl.set(bt, { attr: { seed: 2 + (k % 5) } }, tt);
  // camera: the page settles from a slight tilt while the lens drifts in toward the circled word
  tl.fromTo(pad, { rotation: -4.5 }, { rotation: -2.5, duration: D, ease: "power1.inOut", immediateRender: true }, 0);
  tl.fromTo("#cam", { scale: 1.02 }, { scale: 1.08, duration: D, ease: "power1.inOut", immediateRender: true }, 0);
  MV.done();
})();
</script>
</body>
</html>
